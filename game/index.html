		<script>
			// check if autoplay is allowed
			let testAudio = new Audio("audio/achievement.mp3");
			testAudio
				.play()
				.then(() => {
					// autoplay is allowed, destroy the test audio element
					testAudio.muted = true;
					testAudio.src = "";
					// init the game
					$User.Client.PC && $User.HTTP
						? ((oS.AutoSun = Math.floor(getCookie("JSPVZAutoSun"))) && ($("cAutoSun").checked = true),
							(oS.Silence = Math.floor(getCookie("JSPVZSilence"))) && ($("cSilence").checked = true))
						: ((oS.AutoSun = 1), ($("cAutoSun").checked = true), (oS.Silence = 0), ($("cSilence").checked = false));
					InitGame();
				})
				.catch(() => {
					// autoplay is not allowed, add the button to enable audio
					const cover = document.createElement("div");
					cover.style.width = "100%";
					cover.style.height = "100%";
					cover.className = "immune-entry-cover";
					document.querySelector("#dAll").appendChild(cover);
					const btnEnableAudio = document.createElement("button");
					btnEnableAudio.classList.add("BigLevel", "button");
					btnEnableAudio.style.width = "170px";
					btnEnableAudio.style.position = "absolute";
					btnEnableAudio.style.textAlign = "center";
					btnEnableAudio.style.left = "50%";
					btnEnableAudio.style.top = "50%";
					btnEnableAudio.style.transform = "translate(-50%, -50%)";
					btnEnableAudio.style.margin = "0";
					btnEnableAudio.style.cursor = "url(images/interface/Pointer.cur), pointer";
					btnEnableAudio.innerText = "进入感染区";
					btnEnableAudio.onclick = () => {
						// remove the cover
						cover.remove();
						// init the game
						$User.Client.PC && $User.HTTP
							? ((oS.AutoSun = Math.floor(getCookie("JSPVZAutoSun"))) && ($("cAutoSun").checked = true),
								(oS.Silence = Math.floor(getCookie("JSPVZSilence"))) && ($("cSilence").checked = true))
							: ((oS.AutoSun = 1), ($("cAutoSun").checked = true), (oS.Silence = 0), ($("cSilence").checked = false));
						InitGame();

						// remove the button
						btnEnableAudio.remove();
					};
					document.querySelector("#dAll").appendChild(btnEnableAudio);
				});
		</script>
